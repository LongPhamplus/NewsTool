  - { name: SANS ISC,           url: https://isc.sans.edu/rssfeed.xml,          category: skill, every_minutes: 30, alert: local }
  - { name: Elastic Security Labs, url: https://www.elastic.co/security-labs/rss/feed.xml, category: skill, every_minutes: 30, alert: local }
  - { name: The DFIR Report,    url: https://thedfirreport.com/feed/,           category: skill, every_minutes: 60, alert: local }
  - { name: Huntress Blog,      url: https://www.huntress.com/blog/rss.xml,     category: skill, every_minutes: 120, alert: local }
  - { name: Velociraptor,       url: https://docs.velociraptor.app/blog/index.xml, category: skill, every_minutes: 120, alert: local }
