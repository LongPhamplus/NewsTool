[project]
name = "newstool"
version = "0.1.0"
description = "Personal tech/security news aggregator pushing to a Telegram bot"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-telegram-bot[job-queue]>=21.0",
    "pyyaml>=6.0",
    "telethon>=1.36",
]

[project.scripts]
newstool = "newstool.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
